version: '3'

vars:
  RAW_TAG: '{{ .RAW_TAG | default (env "RAW_TAG") }}'
  VERSION: '{{ trimPrefix "v" .RAW_TAG }}'

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  test:go:
    desc: Run Go tests
    dir: backend/go
    cmds:
      - go test ./...

  lint:go:
    desc: Lint Go backend (golangci-lint)
    dir: backend/go
    cmds:
      - golangci-lint run ./...

  lint:go:fix:
    desc: Auto-fix Go lint issues
    dir: backend/go
    cmds:
      - golangci-lint run --fix ./...

  vuln:go:
    desc: Check Go code for known vulnerabilities
    dir: backend/go
    cmds:
      - govulncheck ./...

  dev:web:
    desc: Run Go backend + Vite web app together (same-origin API proxy wired from backend handshake)
    cmds:
      - node scripts/dev-web.mjs

  desktop:dev:
    desc: Build and run the Desktop Shell against the Vite dev server with isolated development data
    cmds:
      - node scripts/build-desktop.mjs --dev

  desktop:build:
    desc: Build desktop release binaries and web assets (RAW_TAG=vX.Y.Z)
    env:
      RAW_TAG: '{{.RAW_TAG}}'
    cmds:
      - node scripts/build-desktop.mjs

  desktop:ffmpeg:
    desc: Export Windows audio tools, licenses and corresponding sources to dist/desktop-ffmpeg
    cmds:
      - docker build --platform linux/amd64 --target desktop-ffmpeg --output type=local,dest=dist/desktop-ffmpeg .

  desktop:package:arch:
    desc: Build a native Linux desktop release and pacman package (RAW_TAG=vX.Y.Z)
    vars:
      ARCH:
        sh: go env GOHOSTARCH
    env:
      RAW_TAG: '{{.RAW_TAG}}'
      PREEN_PACKAGE_VERSION: '{{.VERSION}}'
      GOOS: linux
      GOARCH: '{{.ARCH}}'
    cmds:
      - node scripts/build-desktop.mjs
      - nfpm package --config desktop/nfpm.yaml --packager archlinux --target dist/

  desktop:package:windows:
    desc: Assemble a Windows portable zip from desktop and FFmpeg builds (RAW_TAG=vX.Y.Z)
    env:
      RAW_TAG: '{{.RAW_TAG}}'
    cmds:
      - node scripts/package-windows.mjs

  test:desktop:packaging:
    desc: Check release version validation and portable archive assembly
    cmds:
      - node --test scripts/build-desktop.test.mjs scripts/package-windows.test.mjs
      - go test scripts/zip-directory.go scripts/zip-directory_test.go

  db:rebuild:dev:
    desc: Back up and rebuild .dev_data/cache.db; stop the development backend first
    dir: backend/go
    cmds:
      - go run ./cmd/rebuild-dev-db

  typecheck:web:
    desc: Typecheck the web app (vue-tsc)
    dir: frontend/web
    cmds:
      - pnpm typecheck

  lint:web:
    desc: Lint and format-check the web app (ESLint, @antfu/eslint-config)
    dir: frontend/web
    cmds:
      - pnpm lint

  lint:web:fix:
    desc: Auto-fix web lint and formatting issues
    dir: frontend/web
    cmds:
      - pnpm lint:fix

  test:web:
    desc: Run web app unit tests (Vitest)
    dir: frontend/web
    cmds:
      - pnpm test

  build:web:
    desc: Build the web app for production
    dir: frontend/web
    cmds:
      - pnpm build

  e2e:web:
    desc: Run full-stack browser e2e tests (Playwright; boots backend + Vite). Requires Chromium.
    dir: frontend/web
    env:
      BROWSER_E2E: '1'
    cmds:
      - pnpm exec playwright test

  test:web:browser:
    desc: Run browser component tests (Playwright; boots Vite only). Requires Chromium.
    dir: frontend/web
    cmds:
      - pnpm exec playwright test -c playwright.components.config.ts

  e2e:web:install:
    desc: Install the Playwright Chromium browser for the web e2e smoke
    dir: frontend/web
    cmds:
      - pnpm exec playwright install chromium

  ci:quality:
    desc: Run quality checks (Go + Web)
    cmds:
      - task test:go
      - task lint:go
      - task vuln:go
      - task lint:web
      - task typecheck:web
      - task test:web
      - task build:web

  build:go:windows-x64:
    desc: Build Windows backend binary (x64)
    dir: backend/go
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build {{if .VERSION}}-ldflags "-X main.version={{.VERSION}}" {{end}}-o bin/preen.exe ./cmd/preen

  build:docker:
    desc: Build the linux/amd64 release image (RAW_TAG=vX.Y.Z)
    requires:
      vars: [RAW_TAG]
    cmds:
      - docker build --platform linux/amd64 --build-arg VERSION={{.VERSION}} -t ghcr.io/clementine33/preen:{{.VERSION}} .

  test:docker:
    desc: Smoke-test a locally built image (RAW_TAG=vX.Y.Z)
    requires:
      vars: [RAW_TAG]
    cmds:
      - node scripts/docker-smoke.mjs ghcr.io/clementine33/preen:{{.VERSION}}
