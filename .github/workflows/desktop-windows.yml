name: Windows portable desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example v1.2.3; no dev prerelease)'
        required: true
        type: string

permissions:
  contents: read

env:
  RAW_TAG: ${{ inputs.version }}

jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-desktop-portable
      - name: Validate release version before building
        run: node --input-type=module -e 'import { releaseVersion } from "./scripts/build-desktop.mjs"; releaseVersion(process.env.RAW_TAG)'
      - run: task test:desktop:packaging
      - run: task desktop:ffmpeg
      - uses: actions/upload-artifact@v7
        with:
          name: windows-audio-tools
          path: |
            dist/desktop-ffmpeg/bin
            dist/desktop-ffmpeg/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  portable:
    needs: ffmpeg
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-desktop-portable
      - uses: actions/download-artifact@v8
        with:
          name: windows-audio-tools
          path: dist/desktop-ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: task desktop:build
        env:
          GOARCH: amd64
          CGO_ENABLED: '0'
      - name: Verify all shared whitelist encoders are available
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const configure = readFileSync('scripts/ffmpeg-configure.sh', 'utf8')
          const encoders = configure.match(/--enable-encoder=([^\s]+)/)[1].split(',')
          assert.equal(encoders.length, 9)
          const listing = execFileSync('dist/desktop-ffmpeg/bin/ffmpeg.exe', ['-hide_banner', '-encoders'], { encoding: 'utf8' })
          const available = new Set(listing.split('\n').map(line => line.trim().split(/\s+/)[1]))
          for (const encoder of encoders) assert(available.has(encoder), `Missing encoder: ${encoder}`)
          NODE
      - run: task desktop:package:windows
      - uses: actions/upload-artifact@v7
        with:
          name: preen-windows-portable
          path: dist/preen-*-windows-amd64.zip
          if-no-files-found: error
          compression-level: 0
