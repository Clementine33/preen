services:
  preen:
    image: ghcr.io/clementine33/preen:${PREEN_VERSION:?Set PREEN_VERSION in .env to a published release}
    platform: linux/amd64
    user: "1000:1000"
    ports:
      - "127.0.0.1:8765:8765" # Replace with your NAS LAN address for LAN access.
    environment:
      PREEN_TOKEN: ${PREEN_TOKEN:?Set PREEN_TOKEN in .env}
      # PREEN_LOG_LEVEL: debug # debug | info (default) | warn | error
    volumes:
      - ./data:/data
      - /srv/media/audio:/media/audio
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: # Docker's default json-file driver never rotates.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
