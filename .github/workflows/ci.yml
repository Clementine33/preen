name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new PR commit supersedes its older run. Keep main's result for shipped code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
      pull-requests: read
    outputs:
      # PR checks cannot satisfy a push's full suite, even for the same tree.
      duplicate: ${{ steps.duplicate.outcome == 'success' && steps.duplicate.outputs.should_skip == 'true' && fromJSON(steps.duplicate.outputs.skipped_by).event == 'push' }}
      go: ${{ steps.paths.outcome != 'success' || steps.paths.outputs.go == 'true' }}
      web: ${{ steps.paths.outcome != 'success' || steps.paths.outputs.web == 'true' }}
      desktop: ${{ steps.paths.outcome != 'success' || steps.paths.outputs.desktop == 'true' }}
    steps:
      - id: duplicate
        if: github.event_name == 'push' && github.ref_type == 'branch'
        continue-on-error: true
        uses: fkirc/skip-duplicate-actions@v5
      - id: paths
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@v4
        with:
          filters: |
            go:
              - 'backend/go/**'
              - 'mise.toml'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'
            web:
              - 'frontend/web/**'
              - 'scripts/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'
            desktop:
              - 'desktop/**'
              - 'backend/go/**'
              - 'frontend/web/**'
              - 'scripts/build-desktop*.mjs'
              - 'scripts/package-windows*.mjs'
              - 'scripts/zip-directory*.go'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'mise.toml'
              - 'Taskfile.yml'
              - '.github/workflows/ci.yml'
              - '.github/workflows/desktop-windows.yml'

  go-test:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.duplicate != 'true' && (github.event_name != 'pull_request' || needs.prepare.outputs.go == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-go
      - name: Find Go cache paths
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-normal-${{ hashFiles('mise.toml', 'backend/go/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-normal-${{ hashFiles('mise.toml', 'backend/go/go.sum') }}-
      - run: task test:go
      - run: task lint:go

  web-quality:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.duplicate != 'true' && (github.event_name != 'pull_request' || needs.prepare.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-web
      - name: Find pnpm store
        id: pnpm-cache
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:web
      - run: pnpm test:web
      - run: pnpm build:web
      - run: pnpm -C frontend/web exec playwright install chromium --with-deps
      - run: task test:web:browser

  desktop:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.duplicate != 'true' && (github.event_name != 'pull_request' || needs.prepare.outputs.desktop == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      PREEN_SUPERVISOR_TEST_BINARY: ${{ github.workspace }}/preen-test${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-desktop
      - name: Find Go cache paths
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-desktop-${{ hashFiles('mise.toml', 'backend/go/go.sum', 'desktop/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-desktop-${{ hashFiles('mise.toml', 'backend/go/go.sum', 'desktop/go.sum') }}-
      - name: Install Linux WebView build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: task test:desktop:packaging
      - name: Build release backend for lifecycle tests
        working-directory: backend/go
        run: go build -trimpath -ldflags "-X main.version=0.2.0" -o "$PREEN_SUPERVISOR_TEST_BINARY" ./cmd/preen
      - name: Populate placeholder web assets
        working-directory: desktop
        run: printf '<!doctype html><title>Preen CI</title>\n' > assets/index.html
      - name: Test desktop module and service lifecycle
        working-directory: desktop
        run: go test ./... -count=1
      - name: Compile production desktop shell
        working-directory: desktop
        run: go build -trimpath -tags production -ldflags "-X main.version=0.2.0 ${{ runner.os == 'Windows' && '-H windowsgui' || '' }}" -o "${{ runner.temp }}/preen-desktop${{ runner.os == 'Windows' && '.exe' || '' }}" .

  # Expensive checks start only after both fast suites pass. Main and manual
  # runs are full; pull requests get the path-filtered fast suites above.
  go-race:
    needs: [prepare, go-test, web-quality]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.prepare.outputs.duplicate != 'true' && needs.go-test.result == 'success' && needs.web-quality.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-go-race
      - name: Find Go cache paths
        id: go-cache
        run: |
          echo "modules=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
          echo "build=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: |
            ${{ steps.go-cache.outputs.modules }}
            ${{ steps.go-cache.outputs.build }}
          key: go-${{ runner.os }}-${{ runner.arch }}-race-${{ hashFiles('mise.toml', 'backend/go/go.sum') }}-${{ github.sha }}
          restore-keys: go-${{ runner.os }}-${{ runner.arch }}-race-${{ hashFiles('mise.toml', 'backend/go/go.sum') }}-
      - working-directory: backend/go
        run: go test ./internal/... -race -count=1

  windows-smoke:
    needs: [prepare, go-test, web-quality]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.prepare.outputs.duplicate != 'true' && needs.go-test.result == 'success' && needs.web-quality.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-windows
      - run: task build:go:windows-x64
      - name: Check external tools create no console windows on Windows
        working-directory: backend/go
        run: go test ./internal/adapters/toolprocess -count=1
      - name: Check first-start configuration delivery on Windows
        working-directory: backend/go
        run: go test ./internal/adapters/settings -count=1
      - name: Check conversion handles and strict moves on Windows
        working-directory: backend/go
        run: go test ./internal/adapters/filesystem -run "TestConversion(SourceHandleKeepsPlatformIdentity|Probe)" -count=1
      - name: Check SQLite connections, scan lifecycle and temp spills on Windows
        working-directory: backend/go
        run: go test ./internal/adapters/sqlite -count=1

  web-e2e:
    needs: [prepare, go-test, web-quality]
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.prepare.outputs.duplicate != 'true' && needs.go-test.result == 'success' && needs.web-quality.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-e2e
      - name: Find pnpm store
        id: pnpm-cache
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml') }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend/web exec playwright install chromium --with-deps
      - run: task e2e:web

  # Advisory data changes without source changes, so this never uses duplicate
  # results. It waits for fast checks to avoid work on an already broken build.
  go-vuln:
    needs: [prepare, go-test, web-quality]
    if: >-
      ${{ !cancelled() && github.event_name != 'pull_request' &&
          (needs.prepare.outputs.duplicate == 'true' ||
           (needs.go-test.result == 'success' && needs.web-quality.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-vuln
      - run: task vuln:go

  # Stable required status: skipped jobs are valid only when paths or a prior
  # successful full push explain them. All other skips fail closed.
  result:
    needs: [prepare, go-test, web-quality, desktop, go-race, windows-smoke, web-e2e, go-vuln]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify required checks
        env:
          EVENT: ${{ github.event_name }}
          PREPARE: ${{ needs.prepare.result }}
          DUPLICATE: ${{ needs.prepare.outputs.duplicate }}
          GO_CHANGED: ${{ needs.prepare.outputs.go }}
          WEB_CHANGED: ${{ needs.prepare.outputs.web }}
          DESKTOP_CHANGED: ${{ needs.prepare.outputs.desktop }}
          GO: ${{ needs.go-test.result }}
          WEB: ${{ needs.web-quality.result }}
          DESKTOP: ${{ needs.desktop.result }}
          RACE: ${{ needs.go-race.result }}
          WINDOWS: ${{ needs.windows-smoke.result }}
          E2E: ${{ needs.web-e2e.result }}
          VULN: ${{ needs.go-vuln.result }}
        run: |
          test "$PREPARE" = success
          if [ "$EVENT" = pull_request ]; then
            if [ "$GO_CHANGED" = true ]; then test "$GO" = success; else test "$GO" = skipped; fi
            if [ "$WEB_CHANGED" = true ]; then test "$WEB" = success; else test "$WEB" = skipped; fi
            if [ "$DESKTOP_CHANGED" = true ]; then test "$DESKTOP" = success; else test "$DESKTOP" = skipped; fi
            for check in "$RACE" "$WINDOWS" "$E2E" "$VULN"; do test "$check" = skipped; done
          elif [ "$DUPLICATE" = true ]; then
            for check in "$GO" "$WEB" "$DESKTOP" "$RACE" "$WINDOWS" "$E2E"; do test "$check" = skipped; done
            test "$VULN" = success
          else
            for check in "$GO" "$WEB" "$DESKTOP" "$RACE" "$WINDOWS" "$E2E" "$VULN"; do
              test "$check" = success
            done
          fi


  image:
    needs: result
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
        with:
          minimum_release_age: 7d
          cache: true
          cache_key_prefix: mise-container
      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import { appendFileSync } from 'node:fs'
          const tag = process.env.RELEASE_TAG
          const match = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?$/.exec(tag)
          assert(match, 'Expected vMAJOR.MINOR.PATCH with optional SemVer prerelease')
          assert(!match[4]?.split('.').some(id => /^[0-9]+$/.test(id) && id.length > 1 && id.startsWith('0')), 'Numeric prerelease identifiers must not have leading zeros')
          const version = tag.slice(1)
          assert(version.length <= 128 && !match[4]?.split('.').includes('dev'), 'Invalid release image version')
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\nstable=${!match[4]}\n`)
          NODE
      - name: Build release image without registry credentials
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build --platform linux/amd64 --build-arg "VERSION=$VERSION" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t preen:release .
      - name: Smoke test the image that will be published
        run: node scripts/docker-smoke.mjs preen:release
      - name: Export tested image
        run: docker save -o /tmp/preen-image.tar preen:release
      - uses: actions/upload-artifact@v7
        with:
          name: preen-image
          path: /tmp/preen-image.tar
          compression-level: 0
          retention-days: 1

  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    # Serialize all versions: the existence check and latest update share a lock.
    concurrency:
      group: ghcr-preen-publish
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: preen-image
          path: /tmp
      - run: docker load -i /tmp/preen-image.tar
      - name: Refuse existing versions and publish tested image
        env:
          VERSION: ${{ needs.image.outputs.version }}
          STABLE: ${{ needs.image.outputs.stable }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image=ghcr.io/clementine33/preen
          auth=$(curl --fail-with-body --silent --show-error \
            --user "$GHCR_USER:$GHCR_TOKEN" \
            'https://ghcr.io/token?service=ghcr.io&scope=repository:clementine33/preen:pull,push')
          token=$(jq -er '.token | select(type == "string" and length > 0)' <<< "$auth")
          echo "::add-mask::$token"
          status=$(curl --silent --show-error --output /tmp/manifest-response --write-out '%{http_code}' \
            --header "Authorization: Bearer $token" \
            --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/clementine33/preen/manifests/$VERSION")
          case "$status" in
            404) ;;
            200) echo "Version $VERSION already exists; refusing to overwrite" >&2; exit 1 ;;
            *) echo "Cannot verify version availability (HTTP $status); refusing to publish" >&2; exit 1 ;;
          esac
          trap 'docker logout ghcr.io' EXIT
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
          docker tag preen:release "$image:$VERSION"
          docker push "$image:$VERSION"
          if [ "$STABLE" = true ]; then
            docker tag preen:release "$image:latest"
            docker push "$image:latest"
          fi
