[tools]
node = "26"
go = "1.27.3"
golangci-lint = "2.15.0"
pnpm = "12.16.1"
task = "3.54.0"
nfpm = "2.48.0"
# Inline table keeps `^ffmpeg = "` unique to [vars] for Renovate and the build scripts.
ffmpeg = { version = "{{vars.ffmpeg}}" }
"go:golang.org/x/tools/gopls" = "0.24.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"

# Source dependencies for the container and Windows FFmpeg distributions;
# ffmpeg also pins the dev/CI binary above.
[vars]
ffmpeg = "9.0.2"
lame = "3.100"
opus = "1.6.1"
zlib = "1.3.2"
