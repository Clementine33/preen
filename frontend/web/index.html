<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onsei Organizer</title>
    <!-- Apply theme and motion before first paint to avoid a flash of the wrong theme or a first animation -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('onsei-theme')
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) ||
            (stored !== 'light' && stored !== 'system')
          document.documentElement.classList.toggle('dark', dark)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
        // Motion: the stored "reduce" choice applies before any animation plays.
        try {
          if (localStorage.getItem('onsei-motion') === 'reduce') document.documentElement.classList.add('reduce-motion')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
